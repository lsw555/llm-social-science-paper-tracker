name: Find and summarize new papers
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Discover papers and generate AI summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_papers.py
      - name: Commit new papers
        run: |
          git config user.name 'llm-paper-tracker-bot'
          git config user.email 'llm-paper-tracker-bot@users.noreply.github.com'
          git add data/papers.json
          git diff --cached --quiet || git commit -m 'Update LLM social science papers'
          git push
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published tracker
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload tracker
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy tracker
        id: deployment
        uses: actions/deploy-pages@v4
